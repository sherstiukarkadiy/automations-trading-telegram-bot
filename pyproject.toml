[project]
name = "trading-mirror-bot"
version = "0.1.0"
description = "Telegram bot that mirrors trade signals across Bybit and Propr accounts with per-account risk sizing"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tmbot"]
